<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="一亿 Token 清零协议（细节版）">
  <defs>
    <linearGradient id="kraft" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3E8D0"/>
      <stop offset="0.55" stop-color="#E9DFC9"/>
      <stop offset="1" stop-color="#D6C6A6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FCF7E8"/>
      <stop offset="1" stop-color="#EDE1C2"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3C35"/>
      <stop offset="0.14" stop-color="#2B2B26"/>
      <stop offset="1" stop-color="#181814"/>
    </linearGradient>
    <pattern id="bpgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#BFD6E8" stroke-width="1.2" opacity="0.3"/>
    </pattern>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.17  0 0 0 0 0.12  0 0 0 0.3 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#kraft)"/>
    <g opacity="0.18" stroke="#8A7A5C" stroke-width="1.2">
      <path d="M-20 112 H532 M-20 240 H532 M-20 368 H532"/>
      <path d="M112 -20 V532 M240 -20 V532 M368 -20 V532"/>
    </g>

    <g transform="rotate(10 336 200)">
      <rect x="206" y="52" width="258" height="304" rx="4" fill="#0F2436" opacity="0.28" transform="translate(13 15)"/>
      <rect x="206" y="52" width="258" height="304" rx="4" fill="#2F5D8A"/>
      <rect x="206" y="52" width="258" height="304" rx="4" fill="url(#bpgrid)"/>
      <rect x="217" y="63" width="236" height="282" fill="none" stroke="#DCE9F4" stroke-width="2.5" opacity="0.5"/>
      <circle cx="290" cy="148" r="30" fill="none" stroke="#DCE9F4" stroke-width="3" opacity="0.7"/>
      <path d="M260 148 H320 M290 118 V178" stroke="#DCE9F4" stroke-width="3" opacity="0.7"/>
      <path d="M246 226 H410 M246 258 H352 M246 290 H392" stroke="#BCD7EA" stroke-width="6" opacity="0.4"/>
    </g>

    <g transform="rotate(-5 256 268)">
      <rect x="58" y="86" width="396" height="348" rx="8" fill="#2B2B26" opacity="0.34" transform="translate(15 17)"/>
      <rect x="58" y="86" width="396" height="348" rx="8" fill="url(#paper)" stroke="#2B2B26" stroke-width="6"/>

      <rect x="90" y="112" width="150" height="11" rx="5" fill="#2B2B26" opacity="0.72"/>
      <rect x="90" y="136" width="88" height="9" rx="4" fill="#2B2B26" opacity="0.32"/>

      <rect x="88" y="166" width="336" height="182" rx="12" fill="url(#plate)" stroke="#121210" stroke-width="5"/>
      <rect x="98" y="176" width="316" height="162" rx="7" fill="none" stroke="#D9A441" stroke-width="1.6" opacity="0.32"/>
      <text x="112" y="203" font-family="Consolas,'Microsoft YaHei',monospace" font-size="18" letter-spacing="4" fill="#D9A441" opacity="0.8">剩余 TOKEN</text>
      <text x="256" y="322" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="168" fill="#F5EDDC">0</text>
      <path d="M98 238 H414" stroke="#000" stroke-width="1.4" opacity="0.3"/>
      <circle cx="112" cy="330" r="5" fill="#C44536"/>
      <circle cx="126" cy="330" r="5" fill="#D9A441" opacity="0.75"/>

      <g transform="rotate(-13 258 386)" filter="url(#roughen)">
        <rect x="120" y="344" width="280" height="88" rx="10" fill="#C44536" fill-opacity="0.07" stroke="#C44536" stroke-width="9" opacity="0.92"/>
        <text x="260" y="408" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-weight="900" font-size="64" letter-spacing="18" fill="#C44536" opacity="0.9">清零</text>
      </g>
    </g>

    <rect width="512" height="512" filter="url(#grain)" fill="none"/>
    <rect x="3" y="3" width="506" height="506" rx="106" fill="none" stroke="#2B2B26" stroke-width="6" opacity="0.5"/>
  </g>
</svg>
