<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="一亿 Token 清零协议">
  <defs>
    <linearGradient id="kraft" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3E8D0"/>
      <stop offset="1" stop-color="#D8C8A8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF7E8"/>
      <stop offset="1" stop-color="#EBDDBB"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3C35"/>
      <stop offset="0.14" stop-color="#282823"/>
      <stop offset="1" stop-color="#15150F"/>
    </linearGradient>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#kraft)"/>

    <g transform="rotate(10 360 210)">
      <rect x="232" y="60" width="270" height="316" rx="6" fill="#2B2B26" opacity="0.3" transform="translate(14 16)"/>
      <rect x="232" y="60" width="270" height="316" rx="6" fill="#2F5D8A"/>
      <rect x="248" y="76" width="238" height="284" fill="none" stroke="#DCE9F4" stroke-width="3" opacity="0.45"/>
      <path d="M248 160 H486 M248 268 H486" stroke="#BCD7EA" stroke-width="7" opacity="0.35"/>
    </g>

    <g transform="rotate(-4 256 268)">
      <rect x="40" y="64" width="416" height="380" rx="10" fill="#2B2B26" opacity="0.36" transform="translate(16 18)"/>
      <rect x="40" y="64" width="416" height="380" rx="10" fill="url(#paper)" stroke="#2B2B26" stroke-width="10"/>

      <rect x="86" y="118" width="332" height="226" rx="14" fill="url(#plate)" stroke="#121210" stroke-width="7"/>
      <path d="M86 240 H418" stroke="#000" stroke-width="3" opacity="0.45"/>
      <text x="252" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="212" fill="#F5EDDC">0</text>

      <g transform="rotate(-12 256 400)">
        <rect x="96" y="342" width="330" height="112" rx="12" fill="#C44536" fill-opacity="0.13"/>
        <rect x="96" y="342" width="330" height="112" rx="12" fill="none" stroke="#C44536" stroke-width="14" opacity="0.92"/>
        <text x="261" y="424" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-weight="900" font-size="78" letter-spacing="18" fill="#C44536" opacity="0.92">清零</text>
      </g>
    </g>

    <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#2B2B26" stroke-width="8" opacity="0.55"/>
  </g>
</svg>
